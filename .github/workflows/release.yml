# Build and publish the demo images on a version tag.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Publishes both images to Docker Hub as :<version> and :latest. The images are
# linux/amd64 only: the eBPF leg is x86_64-only.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account
#   DOCKERHUB_TOKEN     Docker Hub access token with write scope
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: build + push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unified
            image: aqua-protection-demo
            context: .
            file: unified/Dockerfile
          - name: dta-sim
            image: dta-sim
            context: dta-sim
            file: dta-sim/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Derive version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}

      # Recorded for the release, never gating: the old base images are
      # deliberate and always carry findings.
      - name: Vulnerability report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
          format: table
          exit-code: '0'

      - name: Job summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo '```'
            echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.version.outputs.value }}"
            echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest"
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
